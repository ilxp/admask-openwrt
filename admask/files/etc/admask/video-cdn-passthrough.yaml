# AdMask 视频 CDN 直通白名单
#
# ─────────────────────────────────────────────────────────────
# 用途
# ─────────────────────────────────────────────────────────────
#
# 匹配的域名**跳过 MITM**——浏览器直连 CDN，保留 HTTP/2/3。
# 避免 MITM 后强制降级到 HTTP/1.1 的 6 连接限制——
# 视频加载速度提升 2-3 倍。
#
# ─────────────────────────────────────────────────────────────
# 匹配规则
# ─────────────────────────────────────────────────────────────
#
#   host == 后缀 或 host 以 .后缀 结尾
#
#   ".cibntv.net" -> "valipl.cp31.ott.cibntv.net" 命中
#   ".cibntv.net" -> "cibntv.net"                 不命中（需要前导点）
#
# ─────────────────────────────────────────────────────────────
# 什么该加 / 什么不该加
# ─────────────────────────────────────────────────────────────
#
# 该加：
#   1. 纯视频分片 CDN——已加密的 mp4/ts，不需要内容改写
#   2. Certificate Pinning 域名——MITM 会握手失败导致裂图
#   3. 反广告检测站点——MITM 会触发"请关闭VPN"拒绝播放
#
# 不该加：
#   1. 站点主页面——需要元素隐藏 + Scriptlet 注入
#   2. 广告 API / VAST 服务器——加进来就永远不过滤
#   3. 过于宽泛的后缀（如 ".com" / ".cn"）——会导致全站直通
#
# ─────────────────────────────────────────────────────────────
# 修改后
# ─────────────────────────────────────────────────────────────
#
#   /etc/init.d/admask restart
#
# 关闭直通（全 MITM，能过滤 CDN 广告但视频变慢）：
#   - 启动时加 -video-cdn-passthrough=false
#
# ─────────────────────────────────────────────────────────────

hosts:

  # 优酷 CDN（valipl / vali-g1 等分片服务器）
  # 不直通 → 优酷视频完全无法播放（DRM 依赖分片完整）
  - .cibntv.net

  # B 站视频分片 CDN（upos-*.bilivideo.com）
  # 不直通 → 视频变慢（h1.1 六连接限制），但功能正常
  - .bilivideo.com

  # B 站视频分片 CDN（备用域名）
  - .bilivideo.cn

  # B 站图片 / 静态资源 CDN（i0.hdslb.com / s1.hdslb.com 等）
  # 不直通 → 图片变慢，可能触发 Pinning 裂图
  - .hdslb.com

  # B 站旧版视频 CDN
  - .acgvideo.com

  # 腾讯视频封面 / 缩略图
  # （community.image.video.qpic.cn / vc.qpic.cn / vpic-cover.puui.qpic.cn）
  # Certificate Pinning → 不直通会握手失败 → 封面裂图
  - .qpic.cn

  # 腾讯视频封面 + 播放器 wasm iframe
  # （tvpic.gtimg.cn 封面 / vm.gtimg.cn 播放器 / vfiles.gtimg.cn 组件）
  # 不直通 → 封面裂图 + 播放器加载失败
  - .gtimg.cn

  # ⚠️ 优酷主站 + 广告上报 + 告警接口
  #
  # 优酷播放器会主动检测"广告上报接口是否被拦截"——
  # 一旦发现 yk-ssp.ad.youku.com / acs.youku.com 被 BLOCK，
  # 立即拒绝播放（错误码 0502-10101，"请关闭VPN代理软件"）。
  #
  # 且优酷走 Widevine DRM——广告与正片物理不可分割，
  # AdMask 即便 MITM 也无法过滤优酷广告。
  #
  # 结论：整体直通——保留播放功能，放弃广告过滤。
  - .youku.com

  # 优酷图片 CDN
  - .ykimg.com