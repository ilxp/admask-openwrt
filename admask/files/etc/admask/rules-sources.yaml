# ============================================================
# AdMask 安全网关 - 规则订阅源配置
# ============================================================
#
# ─────────────────────────────────────────────────────────────
# 项目定位
# ─────────────────────────────────────────────────────────────
#
# AdMask 致力于打造家庭网络的最后一道防线。通过深度解析 HTTPS
# 流量，精准拦截电信诈骗、钓鱼网站、黄赌毒等恶意黑产广告。
# 连接本路由器的老人与儿童设备，无需任何额外配置即可受到保护。
#
# ─────────────────────────────────────────────────────────────
# 工作机制
# ─────────────────────────────────────────────────────────────
#
#   - 启动时从所有 enabled 的源下载规则到 config/cache/
#   - 后台每 -update-interval（默认 24h）检查更新
#   - 每个源的实际刷新频率由各自的 refresh 字段决定
#
# ─────────────────────────────────────────────────────────────
# 字段说明
# ─────────────────────────────────────────────────────────────
#
#   name     源名称（日志显示用；也是缓存文件名）
#   type     remote（在线 URL）/ file（本地文件）
#   url      remote 必填——订阅 URL
#   path     file 必填——本地文件路径
#   refresh  更新间隔（默认 24h）——仅 remote
#            ⚠️ 必须带单位！'86400' 会被解析为 86400 纳秒（86μs）
#            ✅ 24h / 30m / 86400s / "24h"
#            ❌ 86400 / 3600 / 60（这些是纳秒）
#   enabled  是否启用（默认 true）
#
# ⚠️ 缓存文件名 = <sanitized-name>.txt —— 两个源不能同名！
#    同名源会互相覆盖——请用不同的 name 字段。
#

sources:

  # ────────────────────────────────────────────
  # ★ 核心安全源（强烈建议保持开启）
  # ────────────────────────────────────────────
  # AdGuard Base —— 国际通用广告与追踪过滤
  - name: AdGuard_Base
    type: remote
    url: https://filters.adtidy.org/extension/ublock/filters/2.txt
    refresh: 24h
    enabled: true

  # ────────────────────────────────────────────
  # 示例——添加你自己的安全/过滤源
  # ────────────────────────────────────────────
  # 添加你自己的源时——复制下面的块——改 name / url——enabled 改 true。
  # name 必须唯一——否则缓存文件会冲突（<name>.txt）。
  #
  - name: Custom_Security_Filter
    type: remote
    url: https://rules.example.com/security-list.txt
    refresh: 24h
    enabled: false

  # 从本地文件加载规则——按需启用
  # - name: My Local Rules
  #   type: file
  #   path: ./my-rules.txt
  #   enabled: true

# ═══════════════════════════════════════════════════════════════
# Generic CSS 软上限
#
# Generic CSS = 所有"不绑定 host"的元素隐藏规则拼装成的 CSS
# （如 [class*="ad"]、.ad-banner）。每次 HTML 响应都会注入它。
# 大小取决于启用的订阅——默认安全源实测约 1.2 MB。
#
# 两种模式：
#    0  不限：全量注入 generic CSS（桌面 / x86 / 高端 ARM 可用）
#    正数 手动：超过该值（KB）则跳过 generic，只注入 specific
#
# ⚠️ 重要机制：
#     ABP 的 generic 规则是「全有或全无」——超过上限时，
#     全部 generic 规则都跳过，不是「部分注入」。
#
# 实际大小看启动日志：
#   [CSS-CACHE] generic CSS cached: 1229660 bytes
#                                    ↑ 除以 1024 得 KB
#
# 生效判断（访问任意网站看日志）：
#   generic=1229660  → ✅ 已注入
#   generic=SKIPPED  → ❌ 被跳过（超过上限）
#
# 推荐配置：
#    1500（默认）：覆盖当前 1.2 MB 的常规大小，同时防极端膨胀。
#    0          ：不限（桌面 / x86 / 高端 ARM 可用）。
#
# 弱路由器用户：
#    不建议配置 500 以下。一旦 generic 超过 500KB 且副引擎熔断，
#    页面元素隐藏将会完全失效。更安全的做法是保持 1500。
# ═══════════════════════════════════════════════════════════════                             
options:
    max_generic_css_kb: 1500       # 默认为1500。防 OOM 同时保留元素隐藏。
    # max_generic_css_kb: 0        # 0=不限 / 正数=KB 上限