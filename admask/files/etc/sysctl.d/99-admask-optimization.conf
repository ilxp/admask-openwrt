# ====== AdMask 专属网络优化 (通用 OpenWrt 版) ======
# 文件: /etc/sysctl.d/99-admask-optimization.conf

# --- TCP Fast Open ---
net.ipv4.tcp_fastopen=3

# --- 高并发连接队列 ---
net.ipv4.tcp_max_syn_backlog=8192
net.core.somaxconn=8192
net.ipv4.tcp_fin_timeout=15
net.ipv4.ip_local_port_range=1024 65535

# --- 缓冲区 (关键修改) ---
# 根据你的典型代理 RTT 和目标带宽计算 BDP，取 2-3 倍余量。
# 以下示例按 "目标500Mbps + RTT 150ms" 估算，设为 24MB。
# 如果是千兆目标 + 高延迟，可提升至 32MB-48MB；若设备内存 ≤128MB 且并发不高，维持 16MB 也合理。
net.core.rmem_max=25165824
net.core.wmem_max=25165824
net.ipv4.tcp_rmem=4096 87380 25165824
net.ipv4.tcp_wmem=4096 65536 25165824

# --- TIME_WAIT 处理 (关键决策点) ---
# 选项 A (保守/推荐): 保持默认，不显式开启 tw_reuse，靠端口范围和队列参数应对压力。
# net.ipv4.tcp_tw_reuse=0   # 显式写 0 或在文件里注释掉这一行
# 选项 B (激进): 仅当代理软件明确要求且你接受潜在的 NAT 边缘风险时，才开启。
net.ipv4.tcp_tw_reuse=1     # <-- 请根据你的实际情况二选一，不要同时生效

# --- 文件句柄 ---
fs.file-max=65535